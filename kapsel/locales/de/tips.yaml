# Kapsel Terminal Tips & Shortcuts (Deutsch)
title: "Tipp:"
tips:
  - "Wenn nur eine Vervollständigungsempfehlung vorhanden ist, drücke [bold #00f0ff]→[/] (Pfeil rechts), um sie sofort zu akzeptieren."
  - "Drücke [bold #00f0ff]→[/] (Pfeil rechts), um Inline-Geistervorhersagen Wort für Wort zu akzeptieren; doppeltippen oder halten, um die gesamte Zeile zu akzeptieren."
  - "Drücke jederzeit [bold #f59e0b]Tab[/], um tiefe, mehrstufige kontextbewusste Vervollständigungen auszulösen, die von Carapace für über 1.000 Befehle unterstützt werden."
  - "Drücke [bold #f59e0b]Tab[/] zweimal, um das vollständige Vervollständigungsraster-Dropdown zu erweitern."
  - "Wenn das Autovervollständigungsmenü geöffnet ist, drücke [bold #f59e0b]Shift+Tab[/], um rückwärts durch die Kandidaten zu blättern."
  - "Drücke [bold #f59e0b]Ctrl+W[/] oder [bold #f59e0b]Alt+Backspace[/], um schnell ein Wort vor dem Cursor zu löschen."
  - "Drücke [bold #f59e0b]Ctrl+U[/], um die Eingabe vor dem Cursor zu löschen; drücke [bold #f59e0b]Ctrl+K[/], um die Eingabe nach dem Cursor zu löschen."
  - "Drücke [bold #f59e0b]Ctrl+A[/] (oder Home), um zum Zeilenanfang zu springen; drücke [bold #f59e0b]Ctrl+E[/] (oder Ende), um zum Zeilenende zu springen."
  - "Drücke jederzeit [bold #38bdf8]Ctrl+L[/], um den Terminalbildschirm zu löschen und die Kartenoberfläche neu zu zeichnen."
  - "Das Drücken von [bold #f43f5e]Ctrl+C[/] bei leerer Eingabezeile ignoriert die Eingabe sicher, ohne deine Kapsel-Sitzung zu beenden."
  - "Drücke [bold #10b981]Ctrl+Enter[/] (oder Alt+Enter), um Eingaben oder eingefügten mehrzeiligen Text als Befehlsblock auszuführen, ohne kp manuell einzugeben."
  - "Drücke [bold #a855f7]Ctrl+Shift+B[/] (oder [bold #a855f7]Ctrl+B[/]), um den Block-Roaming-Modus zu aktivieren und vergangene Ausgabeergebnisse sowie Millisekunden-Telemetrie zu durchsuchen."
  - "Drücken Sie im Block-Roaming-Modus [bold #10b981]y[/], um die Blockausgabe zu kopieren, [bold #38bdf8]c[/], um den Befehl zu kopieren, und [bold #f59e0b]r[/], um ihn erneut auszuführen."
  - "Drücken Sie im Block-Roaming-Modus [bold #f43f5e]Esc[/] oder [bold #f43f5e]q[/], um das Roaming sanft zu beenden und Ihre vorherige Eingabe wiederherzustellen."
  - "Geben Sie [bold #a855f7]kp -c <Befehle...>[/] ein, und Kapsel führt Unterbefehle parallel in gleichzeitigen Worker-Tracks aus."
  - "Geben Sie [bold #a855f7]kp <Befehle...>[/] ein, um Aufgabenblöcke sequenziell auszuführen, während Umgebung und Arbeitsverzeichnis erhalten bleiben."
  - "Die Eingabe nativer Tools nach [bold #a855f7]kp[/] oder [bold #a855f7]kp -c[/] (z. B. kp git) liefert 100 % verlustfreie Autovervollständigungen für über 1.000 Befehle."
  - "Geben Sie [bold #00f0ff]kps ai <Prompt>[/] ein, und die KI generiert den exakten Shell-Befehl – drücken Sie [Enter], um ihn auszuführen, oder [Tab], um ihn zu kopieren."
  - "Wenn ein Befehl fehlschlägt, geben Sie [bold #00f0ff]kps ai fix[/] (oder kps ai ?) ein, um eine 1-Klick-Root-Cause-Diagnose und eine ausführbare Reparatur zu erhalten."
  - "Geben Sie [bold #00f0ff]kps ai commit[/] ein, um Git-Diffs zu analysieren, Conventional-Commit-Nachrichten zu generieren und mit einem Klick zu committen."
  - "Auf einen kryptischen Befehl gestoßen? Geben Sie [bold #00f0ff]kps ai explain <Befehl>[/] ein, um eine schrittweise Aufschlüsselung jedes Flags zu streamen."
  - "Leiten Sie Daten durch [bold #00f0ff]<Befehl> | kps ai <Prompt>[/], um Logs zu filtern und strukturierte Erkenntnisse in Echtzeit zu extrahieren."
  - "Geben Sie [bold #00f0ff]kps ai scout[/] ein, um eine sofortige Projektaufklärung durchzuführen, die Frameworks, Skripte und architektonische Einstiegspunkte analysiert."
  - "Führen Sie [bold #00f0ff]kps ai config model <Name>[/] aus, um aktive LLM-Modelle im laufenden Betrieb zu wechseln, ohne den Setup-Assistenten erneut auszuführen."
  - "Führen Sie [bold #00f0ff]kps ai config test[/] aus, um einen leichten Ping an den konfigurierten Modell-Endpunkt zu senden und die Konnektivität zu überprüfen."
  - "Geben Sie [bold #38bdf8]z <query>[/] ein, um über das Portal-Plugin zu häufig genutzten Projektverzeichnissen zu springen."
  - "Führen Sie [bold #38bdf8]kps portal open[/] aus, um den aktuellen Ordner direkt im Windows Explorer oder macOS Finder zu öffnen und anzuzeigen."
  - "Geben Sie [bold #38bdf8]kps portal ls[/] ein, um alle überwachten Arbeitsbereichsverzeichnisse nach Frecency-Werten sortiert anzuzeigen."
  - "Führen Sie [bold #38bdf8]kps portal add <path>[/] aus, um ein beliebiges Verzeichnis manuell in den schnellen Portal-Index zu registrieren."
  - "Befehl falsch getippt? Führen Sie [bold #00f0ff]kps fuck[/] aus, um den vorherigen fehlerhaften Befehl automatisch über die thefuck-Engine zu korrigieren."
  - "Führen Sie [bold #38bdf8]kps help <cmd>[/] aus, um sofortige, praktische Spickzettel zu erhalten, die von tealdeer unterstützt werden."
  - "Führen Sie [bold #38bdf8]kps shore[/] aus, um die schnellsten Paketmanager-Spiegel (PyPI, npm, Rust, Go, Homebrew) zu testen und zu wechseln."
  - "Führen Sie [bold #38bdf8]kps init use node@20[/] aus, um Sprachlaufzeiten nicht-invasiv über mise zu konfigurieren."
  - "Führen Sie [bold #38bdf8]kps alias add ll \"ls -la\"[/] aus, um Shell-übergreifende Aliase zu definieren, die in PowerShell, Bash und Zsh identisch funktionieren."
  - "Führen Sie [bold #38bdf8]kps install <pkg>[/] aus, um Pakete mit dem optimalen Host-Paketmanager (Scoop/Winget/Brew/Apt) zu installieren."
  - "Führen Sie [bold #38bdf8]kps autopilot add <cmd>[/] aus, um langlaufende Builds, Downloads oder Skripte in eine Hintergrund-Daemon-Warteschlange einzureihen."
  - "Führen Sie [bold #38bdf8]kps rec[/] aus, um Ihre persönliche Bibliothek wiederkehrender Befehls-Snippets (pet) per Fuzzy-Suche zu durchsuchen und auszuführen."
  - "Führen Sie [bold #38bdf8]kps profile[/] aus, um Shell-Dotfiles und Konfigurationen über mehrere Maschinen hinweg mit chezmoi zu synchronisieren."
  - "Führen Sie [bold #38bdf8]kapsel status[/] aus, um die Terminal-Gesundheit, die aktuelle Host-Shell, die Vervollständigungs-Engine und aktive Plugins zu überprüfen."
  - "Führen Sie [bold #38bdf8]kapsel config edit[/] aus, um Themes, Prompt-Symbole und Kartenstil in Ihrem Standardeditor anzupassen."
  - "Führen Sie [bold #38bdf8]kapsel config set theme dracula[/] aus, um zwischen den Farbpaletten default, dracula, cyberpunk und monochrome zu wechseln."
  - "Führen Sie [bold #38bdf8]kapsel search[/] aus, um offizielle und Community-Plugins zu entdecken, und installieren Sie sie mit kapsel add <name>."
  - "Führen Sie [bold #38bdf8]kps config set mode dev[/] aus, um die lokale Plugin-Entwicklung und den Hot-Reload-Modus umzuschalten."
  - "Führen Sie [bold #38bdf8]kapsel upgrade[/] aus, um automatisch den Kapsel-Kern und alle installierten offiziellen Plugins zu überprüfen und zu aktualisieren."
  - "Fügen Sie Ihre persönlichen Notizen oder Team-Befehle zu ~/.kapsel/tips.yaml hinzu; Kapsel mischt sie in die täglichen Tipps ein."
  - "Geben Sie [bold #f43f5e]exit[/] ein oder drücken Sie [bold #f43f5e]Ctrl+D[/], um Kapsel sicher zu verlassen und ohne Verschmutzung zu Ihrer Host-Shell zurückzukehren."
