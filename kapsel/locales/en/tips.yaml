# Kapsel Terminal Tips & Shortcuts (English)
title: "Tip:"
tips:
  - "When there is only 1 completion recommendation, press [bold #00f0ff]→[/] (Right Arrow) to accept it instantly."
  - "Press [bold #00f0ff]→[/] (Right Arrow) to accept inline ghost predictions word-by-word; double-tap or hold to accept the full line."
  - "Press [bold #f59e0b]Tab[/] anytime to trigger deep multi-level context-aware completions powered by Carapace across 1,000+ commands."
  - "Double-tap [bold #f59e0b]Tab[/] to expand the full completion grid matrix dropdown."
  - "When the autocompletion menu is open, press [bold #f59e0b]Shift+Tab[/] to cycle backwards through candidates."
  - "Press [bold #f59e0b]Ctrl+W[/] or [bold #f59e0b]Alt+Backspace[/] to quickly delete a word backwards before the cursor."
  - "Press [bold #f59e0b]Ctrl+U[/] to clear input before the cursor; press [bold #f59e0b]Ctrl+K[/] to clear input after the cursor."
  - "Press [bold #f59e0b]Ctrl+A[/] (or Home) to jump to the beginning of the line; press [bold #f59e0b]Ctrl+E[/] (or End) to jump to the end."
  - "Press [bold #38bdf8]Ctrl+L[/] anytime to clear the terminal screen and redraw the card interface."
  - "Pressing [bold #f43f5e]Ctrl+C[/] on an empty prompt line safely ignores input without killing your capsule session."
  - "Press [bold #10b981]Ctrl+Enter[/] (or Alt+Enter) to execute input or pasted multi-line text as a Command Block without typing kp manually."
  - "Press [bold #a855f7]Ctrl+Shift+B[/] (or [bold #a855f7]Ctrl+B[/]) to enter Block Roaming mode, browsing past execution outputs and millisecond telemetry."
  - "In Block Roaming mode, press [bold #10b981]y[/] to copy block output, [bold #38bdf8]c[/] to copy command, and [bold #f59e0b]r[/] to re-run it."
  - "In Block Roaming mode, press [bold #f43f5e]Esc[/] or [bold #f43f5e]q[/] to smoothly exit roaming and restore your previous input."
  - "Type [bold #a855f7]kp -c <commands...>[/], and Kapsel will execute sub-commands in parallel concurrent worker tracks."
  - "Type [bold #a855f7]kp <commands...>[/] to execute task blocks sequentially while preserving environment and working directory."
  - "Typing native tools after [bold #a855f7]kp[/] or [bold #a855f7]kp -c[/] (e.g. kp git) delivers 100% lossless 1,000+ command autocompletions."
  - "Type [bold #00f0ff]kps ai <prompt>[/], and AI generates the exact shell command—press [Enter] to run or [Tab] to copy."
  - "When a command fails, type [bold #00f0ff]kps ai fix[/] (or kps ai ?) for 1-click root-cause diagnosis and executable repair."
  - "Type [bold #00f0ff]kps ai commit[/] to analyze git diffs, generate Conventional Commit messages, and commit with 1-click."
  - "Encountered a cryptic command? Type [bold #00f0ff]kps ai explain <cmd>[/] to stream a step-by-step breakdown of every flag."
  - "Pipe data through [bold #00f0ff]<cmd> | kps ai <prompt>[/] to filter logs and extract structured insights in real-time."
  - "Type [bold #00f0ff]kps ai scout[/] for instant project reconnaissance analyzing frameworks, scripts, and architectural entrypoints."
  - "Run [bold #00f0ff]kps ai config model <name>[/] to switch active LLM models on the fly without re-running the setup wizard."
  - "Run [bold #00f0ff]kps ai config test[/] to send a lightweight ping to the configured model endpoint and verify connectivity."
  - "Type [bold #38bdf8]z <query>[/] to teleport to frecent project directories via the portal plugin."
  - "Run [bold #38bdf8]kps portal open[/] to reveal and open the current folder directly in Windows Explorer or macOS Finder."
  - "Type [bold #38bdf8]kps portal ls[/] to view all tracked workspace directories ranked by frecency scores."
  - "Run [bold #38bdf8]kps portal add <path>[/] to manually register any directory into the portal fast index."
  - "Mistyped a command? Run [bold #00f0ff]kps fuck[/] to auto-correct the previous erroneous command via thefuck engine."
  - "Run [bold #38bdf8]kps help <cmd>[/] for instantaneous, practical cheatsheets powered by tealdeer."
  - "Run [bold #38bdf8]kps shore[/] to test and switch to the fastest package manager mirrors (PyPI, npm, Rust, Go, Homebrew)."
  - "Run [bold #38bdf8]kps init use node@20[/] to configure language runtimes non-invasively via mise."
  - "Run [bold #38bdf8]kps alias add ll \"ls -la\"[/] to define cross-shell aliases that work identically in PowerShell, Bash, and Zsh."
  - "Run [bold #38bdf8]kps install <pkg>[/] to install packages using the optimal host package manager (Scoop/Winget/Brew/Apt)."
  - "Run [bold #38bdf8]kps autopilot add <cmd>[/] to enqueue long-running builds, downloads, or scripts into a background daemon queue."
  - "Run [bold #38bdf8]kps rec[/] to fuzzy search and execute your personal library of recurring command snippets (pet)."
  - "Run [bold #38bdf8]kps profile[/] to synchronize shell dotfiles and configurations across multiple machines via chezmoi."
  - "Run [bold #38bdf8]kapsel status[/] to inspect terminal health, current host shell, completion engine, and active plugins."
  - "Run [bold #38bdf8]kapsel config edit[/] to customize themes, prompt symbols, and card styling in your default editor."
  - "Run [bold #38bdf8]kapsel config set theme dracula[/] to switch between default, dracula, cyberpunk, and monochrome color palettes."
  - "Run [bold #38bdf8]kapsel search[/] to discover official and community plugins, and install them with kapsel add <name>."
  - "Run [bold #38bdf8]kps config set mode dev[/] to toggle plugin local development and hot-reload mode."
  - "Run [bold #38bdf8]kapsel upgrade[/] to automatically check and update Kapsel core and all installed official plugins."
  - "Add your personal notes or team commands to ~/.kapsel/tips.yaml; Kapsel will blend them into daily tips."
  - "Type [bold #f43f5e]exit[/] or press [bold #f43f5e]Ctrl+D[/] to safely exit Kapsel and return to your host shell without pollution."
