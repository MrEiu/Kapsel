# Kapsel Terminal Tips & Shortcuts (Español)
title: "Consejo:"
tips:
  - "Cuando solo hay 1 recomendación de completado, presiona [bold #00f0ff]→[/] (Flecha derecha) para aceptarla al instante."
  - "Presiona [bold #00f0ff]→[/] (Flecha derecha) para aceptar predicciones fantasma en línea palabra por palabra; toca dos veces o mantén presionado para aceptar la línea completa."
  - "Presiona [bold #f59e0b]Tab[/] en cualquier momento para activar completados profundos de múltiples niveles y conscientes del contexto, impulsados por Carapace en más de 1,000 comandos."
  - "Toca dos veces [bold #f59e0b]Tab[/] para expandir el menú desplegable de la cuadrícula de completado completa."
  - "Cuando el menú de autocompletado esté abierto, presiona [bold #f59e0b]Shift+Tab[/] para recorrer hacia atrás entre las opciones."
  - "Presiona [bold #f59e0b]Ctrl+W[/] o [bold #f59e0b]Alt+Backspace[/] para eliminar rápidamente una palabra hacia atrás antes del cursor."
  - "Presiona [bold #f59e0b]Ctrl+U[/] para borrar la entrada antes del cursor; presiona [bold #f59e0b]Ctrl+K[/] para borrar la entrada después del cursor."
  - "Presiona [bold #f59e0b]Ctrl+A[/] (o Inicio) para saltar al principio de la línea; presiona [bold #f59e0b]Ctrl+E[/] (o Fin) para saltar al final."
  - "Presiona [bold #38bdf8]Ctrl+L[/] en cualquier momento para limpiar la pantalla del terminal y redibujar la interfaz de tarjetas."
  - "Presionar [bold #f43f5e]Ctrl+C[/] en una línea de prompt vacía ignora la entrada de forma segura sin terminar tu sesión de cápsula."
  - "Presiona [bold #10b981]Ctrl+Enter[/] (o Alt+Enter) para ejecutar la entrada o texto multilínea pegado como un Bloque de Comandos sin escribir kp manualmente."
  - "Presiona [bold #a855f7]Ctrl+Shift+B[/] (o [bold #a855f7]Ctrl+B[/]) para entrar al modo de Recorrido de Bloques, navegando por salidas de ejecuciones pasadas y telemetría de milisegundos."
  - "En el modo Block Roaming, presiona [bold #10b981]y[/] para copiar la salida del bloque, [bold #38bdf8]c[/] para copiar el comando y [bold #f59e0b]r[/] para volver a ejecutarlo."
  - "En el modo Block Roaming, presiona [bold #f43f5e]Esc[/] o [bold #f43f5e]q[/] para salir suavemente del roaming y restaurar tu entrada anterior."
  - "Escribe [bold #a855f7]kp -c <comandos...>[/], y Kapsel ejecutará subcomandos en pistas de trabajo concurrentes en paralelo."
  - "Escribe [bold #a855f7]kp <comandos...>[/] para ejecutar bloques de tareas secuencialmente mientras se preservan el entorno y el directorio de trabajo."
  - "Escribir herramientas nativas después de [bold #a855f7]kp[/] o [bold #a855f7]kp -c[/] (por ejemplo, kp git) ofrece autocompletados de comandos 100% sin pérdida de más de 1,000."
  - "Escribe [bold #00f0ff]kps ai <prompt>[/], y la IA genera el comando shell exacto: presiona [Enter] para ejecutarlo o [Tab] para copiarlo."
  - "Cuando un comando falla, escribe [bold #00f0ff]kps ai fix[/] (o kps ai ?) para un diagnóstico de causa raíz y reparación ejecutable con 1 clic."
  - "Escribe [bold #00f0ff]kps ai commit[/] para analizar los diffs de git, generar mensajes de Conventional Commit y hacer commit con 1 clic."
  - "¿Encontraste un comando críptico? Escribe [bold #00f0ff]kps ai explain <cmd>[/] para transmitir un desglose paso a paso de cada bandera."
  - "Pasa datos a través de [bold #00f0ff]<cmd> | kps ai <prompt>[/] para filtrar registros y extraer información estructurada en tiempo real."
  - "Escribe [bold #00f0ff]kps ai scout[/] para un reconocimiento instantáneo del proyecto que analiza frameworks, scripts y puntos de entrada arquitectónicos."
  - "Ejecuta [bold #00f0ff]kps ai config model <nombre>[/] para cambiar los modelos LLM activos sobre la marcha sin volver a ejecutar el asistente de configuración."
  - "Ejecuta [bold #00f0ff]kps ai config test[/] para enviar un ping ligero al endpoint del modelo configurado y verificar la conectividad."
  - "Escribe [bold #38bdf8]z <query>[/] para teletransportarte a directorios de proyectos frecuentes mediante el plugin del portal."
  - "Ejecuta [bold #38bdf8]kps portal open[/] para revelar y abrir la carpeta actual directamente en el Explorador de Windows o en el Finder de macOS."
  - "Escribe [bold #38bdf8]kps portal ls[/] para ver todos los directorios de trabajo rastreados, ordenados por puntuaciones de frecencia."
  - "Ejecuta [bold #38bdf8]kps portal add <path>[/] para registrar manualmente cualquier directorio en el índice rápido del portal."
  - "¿Escribiste mal un comando? Ejecuta [bold #00f0ff]kps fuck[/] para autocorregir el comando erróneo anterior mediante el motor thefuck."
  - "Ejecuta [bold #38bdf8]kps help <cmd>[/] para obtener hojas de referencia prácticas e instantáneas impulsadas por tealdeer."
  - "Ejecuta [bold #38bdf8]kps shore[/] para probar y cambiar a los espejos de gestores de paquetes más rápidos (PyPI, npm, Rust, Go, Homebrew)."
  - "Ejecuta [bold #38bdf8]kps init use node@20[/] para configurar los tiempos de ejecución de lenguajes de forma no invasiva mediante mise."
  - "Ejecuta [bold #38bdf8]kps alias add ll \"ls -la\"[/] para definir alias entre shells que funcionen de manera idéntica en PowerShell, Bash y Zsh."
  - "Ejecuta [bold #38bdf8]kps install <pkg>[/] para instalar paquetes usando el gestor de paquetes óptimo del host (Scoop/Winget/Brew/Apt)."
  - "Ejecuta [bold #38bdf8]kps autopilot add <cmd>[/] para poner en cola compilaciones, descargas o scripts de larga duración en una cola de demonio en segundo plano."
  - "Ejecuta [bold #38bdf8]kps rec[/] para buscar de forma difusa y ejecutar tu biblioteca personal de fragmentos de comandos recurrentes (pet)."
  - "Ejecuta [bold #38bdf8]kps profile[/] para sincronizar archivos de configuración del shell y ajustes en múltiples máquinas mediante chezmoi."
  - "Ejecuta [bold #38bdf8]kapsel status[/] para inspeccionar la salud del terminal, el shell anfitrión actual, el motor de autocompletado y los plugins activos."
  - "Ejecuta [bold #38bdf8]kapsel config edit[/] para personalizar temas, símbolos del prompt y estilos de tarjetas en tu editor predeterminado."
  - "Ejecuta [bold #38bdf8]kapsel config set theme dracula[/] para cambiar entre las paletas de colores predeterminada, dracula, cyberpunk y monocromática."
  - "Ejecuta [bold #38bdf8]kapsel search[/] para descubrir plugins oficiales y de la comunidad, e instálalos con kapsel add <nombre>."
  - "Ejecuta [bold #38bdf8]kps config set mode dev[/] para activar el desarrollo local de plugins y el modo de recarga en caliente."
  - "Ejecuta [bold #38bdf8]kapsel upgrade[/] para verificar y actualizar automáticamente el núcleo de Kapsel y todos los plugins oficiales instalados."
  - "Añade tus notas personales o comandos de equipo a ~/.kapsel/tips.yaml; Kapsel los integrará en los consejos diarios."
  - "Escribe [bold #f43f5e]exit[/] o presiona [bold #f43f5e]Ctrl+D[/] para salir de Kapsel de forma segura y volver a tu shell anfitrión sin contaminación."
