# Kapsel Terminal Tips & Shortcuts (Français)
title: "Astuce:"
tips:
  - "Lorsqu'il n'y a qu'une seule recommandation de complétion, appuyez sur [bold #00f0ff]→[/] (Flèche droite) pour l'accepter instantanément."
  - "Appuyez sur [bold #00f0ff]→[/] (Flèche droite) pour accepter les prédictions fantômes en ligne mot par mot ; appuyez deux fois ou maintenez pour accepter la ligne entière."
  - "Appuyez sur [bold #f59e0b]Tab[/] à tout moment pour déclencher des complétions contextuelles profondes à plusieurs niveaux, propulsées par Carapace sur plus de 1 000 commandes."
  - "Appuyez deux fois sur [bold #f59e0b]Tab[/] pour développer le menu déroulant complet de la grille de complétion."
  - "Lorsque le menu d'autocomplétion est ouvert, appuyez sur [bold #f59e0b]Shift+Tab[/] pour parcourir les candidats en arrière."
  - "Appuyez sur [bold #f59e0b]Ctrl+W[/] ou [bold #f59e0b]Alt+Backspace[/] pour supprimer rapidement un mot en arrière avant le curseur."
  - "Appuyez sur [bold #f59e0b]Ctrl+U[/] pour effacer la saisie avant le curseur ; appuyez sur [bold #f59e0b]Ctrl+K[/] pour effacer la saisie après le curseur."
  - "Appuyez sur [bold #f59e0b]Ctrl+A[/] (ou Home) pour aller au début de la ligne ; appuyez sur [bold #f59e0b]Ctrl+E[/] (ou End) pour aller à la fin."
  - "Appuyez sur [bold #38bdf8]Ctrl+L[/] à tout moment pour effacer l'écran du terminal et redessiner l'interface de cartes."
  - "Appuyer sur [bold #f43f5e]Ctrl+C[/] sur une ligne d'invite vide ignore en toute sécurité la saisie sans tuer votre session de capsule."
  - "Appuyez sur [bold #10b981]Ctrl+Enter[/] (ou Alt+Enter) pour exécuter une saisie ou un texte multiligne collé comme bloc de commandes sans taper kp manuellement."
  - "Appuyez sur [bold #a855f7]Ctrl+Shift+B[/] (ou [bold #a855f7]Ctrl+B[/]) pour entrer en mode Roaming de blocs, parcourant les sorties d'exécution passées et la télémétrie en millisecondes."
  - "En mode Block Roaming, appuyez sur [bold #10b981]y[/] pour copier la sortie du bloc, [bold #38bdf8]c[/] pour copier la commande, et [bold #f59e0b]r[/] pour la réexécuter."
  - "En mode Block Roaming, appuyez sur [bold #f43f5e]Échap[/] ou [bold #f43f5e]q[/] pour quitter le roaming en douceur et restaurer votre saisie précédente."
  - "Saisissez [bold #a855f7]kp -c <commandes...>[/], et Kapsel exécutera les sous-commandes en parallèle sur des pistes de travail concurrentes."
  - "Saisissez [bold #a855f7]kp <commandes...>[/] pour exécuter des blocs de tâches séquentiellement tout en préservant l'environnement et le répertoire de travail."
  - "Saisir des outils natifs après [bold #a855f7]kp[/] ou [bold #a855f7]kp -c[/] (par ex. kp git) offre 100 % d'auto-complétions sans perte pour plus de 1 000 commandes."
  - "Saisissez [bold #00f0ff]kps ai <invite>[/], et l'IA génère la commande shell exacte—appuyez sur [Entrée] pour l'exécuter ou sur [Tab] pour la copier."
  - "Lorsqu'une commande échoue, saisissez [bold #00f0ff]kps ai fix[/] (ou kps ai ?) pour un diagnostic de cause racine en 1 clic et une réparation exécutable."
  - "Saisissez [bold #00f0ff]kps ai commit[/] pour analyser les diffs git, générer des messages de commit conventionnels et valider en 1 clic."
  - "Face à une commande obscure ? Saisissez [bold #00f0ff]kps ai explain <cmd>[/] pour diffuser une explication étape par étape de chaque option."
  - "Acheminez des données via [bold #00f0ff]<cmd> | kps ai <invite>[/] pour filtrer les journaux et extraire des informations structurées en temps réel."
  - "Saisissez [bold #00f0ff]kps ai scout[/] pour une reconnaissance instantanée du projet, analysant les frameworks, scripts et points d'entrée architecturaux."
  - "Exécutez [bold #00f0ff]kps ai config model <nom>[/] pour changer de modèle LLM actif à la volée sans relancer l'assistant de configuration."
  - "Exécutez [bold #00f0ff]kps ai config test[/] pour envoyer un ping léger au point de terminaison du modèle configuré et vérifier la connectivité."
  - "Tapez [bold #38bdf8]z <requête>[/] pour vous téléporter vers les répertoires de projets fréquents via le plugin portail."
  - "Exécutez [bold #38bdf8]kps portal open[/] pour révéler et ouvrir le dossier actuel directement dans l'Explorateur Windows ou le Finder macOS."
  - "Tapez [bold #38bdf8]kps portal ls[/] pour afficher tous les répertoires de travail suivis, classés par scores de fréquence."
  - "Exécutez [bold #38bdf8]kps portal add <chemin>[/] pour enregistrer manuellement tout répertoire dans l'index rapide du portail."
  - "Vous avez mal saisi une commande ? Exécutez [bold #00f0ff]kps fuck[/] pour corriger automatiquement la commande erronée précédente via le moteur thefuck."
  - "Exécutez [bold #38bdf8]kps help <cmd>[/] pour obtenir des antisèches instantanées et pratiques propulsées par tealdeer."
  - "Exécutez [bold #38bdf8]kps shore[/] pour tester et basculer vers les miroirs de gestionnaires de paquets les plus rapides (PyPI, npm, Rust, Go, Homebrew)."
  - "Exécutez [bold #38bdf8]kps init use node@20[/] pour configurer les environnements d'exécution de langages de manière non invasive via mise."
  - "Exécutez [bold #38bdf8]kps alias add ll \"ls -la\"[/] pour définir des alias interpréteurs qui fonctionnent de manière identique dans PowerShell, Bash et Zsh."
  - "Exécutez [bold #38bdf8]kps install <pkg>[/] pour installer des paquets en utilisant le gestionnaire de paquets hôte optimal (Scoop/Winget/Brew/Apt)."
  - "Exécutez [bold #38bdf8]kps autopilot add <cmd>[/] pour mettre en file d'attente des builds, téléchargements ou scripts de longue durée dans une file de démons en arrière-plan."
  - "Exécutez [bold #38bdf8]kps rec[/] pour rechercher de manière floue et exécuter votre bibliothèque personnelle de snippets de commandes récurrents (pet)."
  - "Exécutez [bold #38bdf8]kps profile[/] pour synchroniser les dotfiles du shell et les configurations sur plusieurs machines via chezmoi."
  - "Exécutez [bold #38bdf8]kapsel status[/] pour inspecter la santé du terminal, le shell hôte actuel, le moteur de complétion et les plugins actifs."
  - "Exécutez [bold #38bdf8]kapsel config edit[/] pour personnaliser les thèmes, les symboles d'invite et le style des cartes dans votre éditeur par défaut."
  - "Exécutez [bold #38bdf8]kapsel config set theme dracula[/] pour basculer entre les palettes de couleurs default, dracula, cyberpunk et monochrome."
  - "Exécutez [bold #38bdf8]kapsel search[/] pour découvrir les plugins officiels et communautaires, et installez-les avec kapsel add <name>."
  - "Exécutez [bold #38bdf8]kps config set mode dev[/] pour activer le développement local des plugins et le mode de rechargement à chaud."
  - "Exécutez [bold #38bdf8]kapsel upgrade[/] pour vérifier et mettre à jour automatiquement le cœur de Kapsel et tous les plugins officiels installés."
  - "Ajoutez vos notes personnelles ou commandes d'équipe dans ~/.kapsel/tips.yaml ; Kapsel les intégrera aux astuces quotidiennes."
  - "Tapez [bold #f43f5e]exit[/] ou appuyez sur [bold #f43f5e]Ctrl+D[/] pour quitter Kapsel en toute sécurité et revenir à votre shell hôte sans pollution."
