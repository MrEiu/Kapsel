# Kapsel Terminal Tips & Shortcuts (日本語)
title: "ヒント:"
tips:
  - "補完候補が1つだけの場合、[bold #00f0ff]→[/]（右矢印）を押すと即座に受け入れられます。"
  - "[bold #00f0ff]→[/]（右矢印）を押すとインラインのゴースト予測を単語単位で受け入れ、ダブルタップまたは長押しで行全体を受け入れます。"
  - "[bold #f59e0b]Tab[/]をいつでも押すと、Carapaceが1,000以上のコマンドにわたって提供する、深い多層のコンテキスト認識型補完がトリガーされます。"
  - "[bold #f59e0b]Tab[/]をダブルタップすると、完全な補完グリッドマトリックスのドロップダウンが展開されます。"
  - "自動補完メニューが開いているときに、[bold #f59e0b]Shift+Tab[/]を押すと、候補を逆方向に循環できます。"
  - "[bold #f59e0b]Ctrl+W[/]または[bold #f59e0b]Alt+Backspace[/]を押すと、カーソルより前の単語をすばやく削除できます。"
  - "[bold #f59e0b]Ctrl+U[/]を押すとカーソルより前の入力をクリアし、[bold #f59e0b]Ctrl+K[/]を押すとカーソルより後ろの入力をクリアします。"
  - "[bold #f59e0b]Ctrl+A[/]（またはHome）を押すと行頭に移動し、[bold #f59e0b]Ctrl+E[/]（またはEnd）を押すと行末に移動します。"
  - "[bold #38bdf8]Ctrl+L[/]をいつでも押すと、ターミナル画面をクリアしてカードインターフェースを再描画します。"
  - "空のプロンプト行で[bold #f43f5e]Ctrl+C[/]を押すと、カプセルセッションを終了させることなく、入力を安全に無視します。"
  - "[bold #10b981]Ctrl+Enter[/]（またはAlt+Enter）を押すと、入力または貼り付けた複数行のテキストを、kpを手動で入力せずにコマンドブロックとして実行できます。"
  - "[bold #a855f7]Ctrl+Shift+B[/]（または[bold #a855f7]Ctrl+B[/]）を押すとブロックローミングモードに入り、過去の実行出力とミリ秒単位のテレメトリを閲覧できます。"
  - "ブロックローミングモードでは、[bold #10b981]y[/] を押すとブロック出力をコピーし、[bold #38bdf8]c[/] を押すとコマンドをコピーし、[bold #f59e0b]r[/] を押すと再実行できます。"
  - "ブロックローミングモードでは、[bold #f43f5e]Esc[/] または [bold #f43f5e]q[/] を押すと、ローミングをスムーズに終了して以前の入力を復元できます。"
  - "[bold #a855f7]kp -c <commands...>[/] と入力すると、Kapsel はサブコマンドを並列の同時ワーカートラックで実行します。"
  - "[bold #a855f7]kp <commands...>[/] と入力すると、環境と作業ディレクトリを維持しながらタスクブロックを順次実行します。"
  - "[bold #a855f7]kp[/] または [bold #a855f7]kp -c[/] の後にネイティブツールを入力すると（例: kp git）、100%ロスレスで1,000以上のコマンド自動補完が提供されます。"
  - "[bold #00f0ff]kps ai <prompt>[/] と入力すると、AI が正確なシェルコマンドを生成します。[Enter] で実行、[Tab] でコピーできます。"
  - "コマンドが失敗した場合は、[bold #00f0ff]kps ai fix[/]（または kps ai ?）と入力すると、ワンクリックで根本原因を診断し、実行可能な修正を行えます。"
  - "[bold #00f0ff]kps ai commit[/] と入力すると、git の差分を分析し、Conventional Commit メッセージを生成して、ワンクリックでコミットできます。"
  - "意味不明なコマンドに遭遇しましたか？[bold #00f0ff]kps ai explain <cmd>[/] と入力すると、すべてのフラグをステップバイステップで解説するストリームが表示されます。"
  - "[bold #00f0ff]<cmd> | kps ai <prompt>[/] でデータをパイプすると、ログをフィルタリングしてリアルタイムに構造化された洞察を抽出できます。"
  - "[bold #00f0ff]kps ai scout[/] と入力すると、フレームワーク、スクリプト、アーキテクチャのエントリポイントを分析する即時プロジェクト偵察が実行されます。"
  - "[bold #00f0ff]kps ai config model <name>[/] を実行すると、セットアップウィザードを再実行せずにアクティブな LLM モデルをその場で切り替えられます。"
  - "[bold #00f0ff]kps ai config test[/] を実行すると、設定済みモデルのエンドポイントへ軽量なpingを送信し、接続性を確認できます。"
  - "[bold #38bdf8]z <query>[/] と入力すると、ポータルプラグイン経由で最近使用したプロジェクトディレクトリへ瞬時に移動できます。"
  - "[bold #38bdf8]kps portal open[/] を実行すると、現在のフォルダをWindowsエクスプローラーまたはmacOS Finderで直接開きます。"
  - "[bold #38bdf8]kps portal ls[/] と入力すると、追跡中のワークスペースディレクトリをフリーケンシースコア順に表示します。"
  - "[bold #38bdf8]kps portal add <path>[/] を実行すると、任意のディレクトリをポータルの高速インデックスに手動で登録できます。"
  - "コマンドを打ち間違えましたか？ [bold #00f0ff]kps fuck[/] を実行すると、thefuckエンジンにより直前の誤ったコマンドを自動修正します。"
  - "[bold #38bdf8]kps help <cmd>[/] を実行すると、tealdeerによる即時的で実用的なチートシートを表示します。"
  - "[bold #38bdf8]kps shore[/] を実行すると、最速のパッケージマネージャーミラー（PyPI、npm、Rust、Go、Homebrew）をテストして切り替えます。"
  - "[bold #38bdf8]kps init use node@20[/] を実行すると、mise経由で言語ランタイムを非侵襲的に設定します。"
  - "[bold #38bdf8]kps alias add ll \"ls -la\"[/] を実行すると、PowerShell、Bash、Zshで同一動作するクロスシェルエイリアスを定義します。"
  - "[bold #38bdf8]kps install <pkg>[/] を実行すると、最適なホストパッケージマネージャー（Scoop/Winget/Brew/Apt）を使用してパッケージをインストールします。"
  - "[bold #38bdf8]kps autopilot add <cmd>[/] を実行すると、長時間実行されるビルド、ダウンロード、スクリプトをバックグラウンドのデーモンキューに登録します。"
  - "[bold #38bdf8]kps rec[/] を実行して、よく使うコマンドスニペット（pet）の個人ライブラリをファジー検索して実行します。"
  - "[bold #38bdf8]kps profile[/] を実行して、chezmoi を使用して複数のマシン間でシェルのドットファイルと設定を同期します。"
  - "[bold #38bdf8]kapsel status[/] を実行して、ターミナルの健全性、現在のホストシェル、補完エンジン、アクティブなプラグインを検査します。"
  - "[bold #38bdf8]kapsel config edit[/] を実行して、デフォルトのエディタでテーマ、プロンプト記号、カードスタイルをカスタマイズします。"
  - "[bold #38bdf8]kapsel config set theme dracula[/] を実行して、default、dracula、cyberpunk、monochrome のカラーパレットを切り替えます。"
  - "[bold #38bdf8]kapsel search[/] を実行して、公式およびコミュニティのプラグインを発見し、kapsel add <name> でインストールします。"
  - "[bold #38bdf8]kps config set mode dev[/] を実行して、プラグインのローカル開発とホットリロードモードを切り替えます。"
  - "[bold #38bdf8]kapsel upgrade[/] を実行して、Kapsel コアとインストール済みのすべての公式プラグインを自動的にチェックして更新します。"
  - "個人のメモやチームコマンドを ~/.kapsel/tips.yaml に追加します。Kapsel はそれらを毎日のヒントに組み込みます。"
  - "[bold #f43f5e]exit[/] と入力するか、[bold #f43f5e]Ctrl+D[/] を押して、Kapsel を安全に終了し、汚染なしでホストシェルに戻ります。"
