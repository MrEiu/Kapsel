# Руководство и шпаргалка по системе Kapsel (Русский)
meta:
  title: "KAPSEL"
  subtitle: "Руководство пользователя и быстрая шпаргалка по командам"
  architecture: "Единый конвейер команд: 'kapsel <cmd>' и 'kps <cmd>' используют один и тот же движок."
  version_prefix: "v"

modes:
  title: "🚀 Два основных режима взаимодействия"
  columns:
    mode: "Режим"
    trigger: "Запуск"
    description: "Поведение и возможности"
  rows:
    - name: "Нативный режим"
      trigger: "Прямой ввод команды"
      description: "100% нативное выполнение в системе (git, docker, npm, python, vim) с контекстным автодополнением Carapace."
    - name: "Режим Kapsel"
      trigger: "Префикс 'kapsel ' или 'kps '"
      description: "Единые капсульные команды (help, status, config, language, add, toggle и плагины); Tab открывает список."

quickstart:
  title: "⚡ Быстрый старт"
  items:
    - step: "1. Запуск интерактивной оболочки"
      cmd: "kapsel toggle"
      desc: "Открывает капсульный терминал с автодополнением и умной историей команд."
    - step: "2. Нативное выполнение"
      cmd: "git checkout -b feature"
      desc: "Выполняйте любые нативные команды без трения с подсказками веток и флагов."
    - step: "3. Прямой разовый вызов"
      cmd: "kps status"
      desc: "Запускайте капсульные утилиты прямо из внешнего PowerShell, Bash или CMD."
    - step: "4. Безопасный выход"
      cmd: "exit"
      desc: "Чистый возврат в родительский терминал без остаточных фоновых процессов."

commands:
  title: "⚙️ Набор команд капсулы (kapsel / kps)"
  columns:
    command: "Команда"
    description: "Описание"
    origin: "Источник"
  builtin_rows:
    - name: "kps help"
      desc: "Показать полное руководство, режимы, горячие клавиши и шпаргалки"
      origin: "Core"
    - name: "kps status"
      desc: "Проверить ОС, родительский терминал, ветку Git и состояние песочницы"
      origin: "Core"
    - name: "kps config"
      desc: "Просмотр, редактирование, чтение, запись или перезагрузка ~/.kapsel/config.yaml"
      origin: "Core"
    - name: "kps language"
      desc: "Просмотр и переключение языка интерфейса (en, zh_CN, ja, es, fr, de, ru)"
      origin: "Core"
    - name: "kps datadir"
      desc: "Просмотр или безопасный перенос каталога данных на другой диск"
      origin: "Core"
    - name: "kps add <plugin>"
      desc: "Установить зависимости и зарегистрировать плагин в среде Kapsel"
      origin: "Core"
    - name: "kps toggle"
      desc: "Включение или выключение интерактивного терминала Kapsel"
      origin: "Core"
    - name: "exit / quit"
      desc: "Безопасный выход из Kapsel с возвратом в родительский шелл"
      origin: "Core"

shortcuts:
  title: "⌨️ Горячие клавиши и эргономика"
  columns:
    key: "Клавиша"
    description: "Действие"
  items:
    - key: "Tab"
      desc: "Открыть меню вариантов автодополнения или переключаться по ним"
    - key: "Shift + Tab"
      desc: "Перемещение назад в меню автодополнения"
    - key: "Enter"
      desc: "Принять выбранный вариант (добавляется пробел) или выполнить строку"
    - key: "↑ (Стрелка вверх)"
      desc: "Хронологическая навигация назад по истории команд"
    - key: "↓ (Стрелка вниз)"
      desc: "Навигация вперед по истории или спуск в меню дополнения"
    - key: "→ (Одно нажатие)"
      desc: "Принять серую подсказку по словам (Word-by-word)"
    - key: "→ (Длительное нажатие)"
      desc: "Принять всю строку серой подсказки целиком"
    - key: "Ctrl + C"
      desc: "Отменить текущую строку ввода и сбросить курсор"
    - key: "Ctrl + D"
      desc: "Чистый выход из интерактивного сеанса (EOF)"

tips:
  title: "💡 Полезные советы"
  items:
    - "'kps config edit' открывает файл настроек в вашем редакторе (VSCode / Блокнот)."
    - "Запускайте 'kps add update' при добавлении или изменении плагинов в репозитории."
    - "Переключайте язык в любое время: 'kps language <код>' (например, 'kps language ru')."
    - "Команда 'kps datadir D:\\KapselData' безопасно перенесет всю песочницу на другой диск."
