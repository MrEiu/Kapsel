# Kapsel Terminal Tips & Shortcuts (Русский)
title: "Совет:"
tips:
  - "Если есть только одна рекомендация завершения, нажмите [bold #00f0ff]→[/] (стрелка вправо), чтобы мгновенно принять её."
  - "Нажмите [bold #00f0ff]→[/] (стрелка вправо), чтобы принимать встроенные призрачные предсказания по словам; двойное нажатие или удержание принимает всю строку."
  - "Нажмите [bold #f59e0b]Tab[/] в любой момент, чтобы запустить глубокие многоуровневые завершения с учётом контекста на основе Carapace для более чем 1000 команд."
  - "Дважды нажмите [bold #f59e0b]Tab[/], чтобы развернуть полную сетку завершений в виде выпадающей матрицы."
  - "Когда меню автозавершения открыто, нажмите [bold #f59e0b]Shift+Tab[/], чтобы циклически перебирать кандидатов в обратном порядке."
  - "Нажмите [bold #f59e0b]Ctrl+W[/] или [bold #f59e0b]Alt+Backspace[/], чтобы быстро удалить слово перед курсором."
  - "Нажмите [bold #f59e0b]Ctrl+U[/], чтобы очистить ввод перед курсором; нажмите [bold #f59e0b]Ctrl+K[/], чтобы очистить ввод после курсора."
  - "Нажмите [bold #f59e0b]Ctrl+A[/] (или Home), чтобы перейти к началу строки; нажмите [bold #f59e0b]Ctrl+E[/] (или End), чтобы перейти к концу."
  - "Нажмите [bold #38bdf8]Ctrl+L[/] в любой момент, чтобы очистить экран терминала и перерисовать карточный интерфейс."
  - "Нажатие [bold #f43f5e]Ctrl+C[/] на пустой строке приглашения безопасно игнорирует ввод, не завершая вашу капсульную сессию."
  - "Нажмите [bold #10b981]Ctrl+Enter[/] (или Alt+Enter), чтобы выполнить ввод или вставленный многострочный текст как командный блок без ручного ввода kp."
  - "Нажмите [bold #a855f7]Ctrl+Shift+B[/] (или [bold #a855f7]Ctrl+B[/]), чтобы войти в режим Block Roaming, просматривая прошлые результаты выполнения и телеметрию с точностью до миллисекунды."
  - "В режиме Block Roaming нажмите [bold #10b981]y[/], чтобы скопировать вывод блока, [bold #38bdf8]c[/] — чтобы скопировать команду, и [bold #f59e0b]r[/] — чтобы выполнить её снова."
  - "В режиме Block Roaming нажмите [bold #f43f5e]Esc[/] или [bold #f43f5e]q[/], чтобы плавно выйти из режима роуминга и восстановить предыдущий ввод."
  - "Введите [bold #a855f7]kp -c <commands...>[/], и Kapsel выполнит подкоманды параллельно в отдельных рабочих потоках."
  - "Введите [bold #a855f7]kp <commands...>[/], чтобы выполнять блоки задач последовательно, сохраняя окружение и рабочую директорию."
  - "Ввод нативных инструментов после [bold #a855f7]kp[/] или [bold #a855f7]kp -c[/] (например, kp git) обеспечивает 100% без потерь автодополнение для более чем 1000 команд."
  - "Введите [bold #00f0ff]kps ai <prompt>[/], и AI сгенерирует точную команду оболочки — нажмите [Enter] для выполнения или [Tab] для копирования."
  - "Когда команда завершается ошибкой, введите [bold #00f0ff]kps ai fix[/] (или kps ai ?) для диагностики первопричины и исправления в один клик."
  - "Введите [bold #00f0ff]kps ai commit[/], чтобы проанализировать git-диффы, сгенерировать сообщения Conventional Commit и выполнить коммит в один клик."
  - "Столкнулись с непонятной командой? Введите [bold #00f0ff]kps ai explain <cmd>[/], чтобы получить пошаговый разбор каждого флага."
  - "Передайте данные через [bold #00f0ff]<cmd> | kps ai <prompt>[/], чтобы фильтровать логи и извлекать структурированные инсайты в реальном времени."
  - "Введите [bold #00f0ff]kps ai scout[/] для мгновенной разведки проекта с анализом фреймворков, скриптов и архитектурных точек входа."
  - "Запустите [bold #00f0ff]kps ai config model <name>[/], чтобы переключить активную LLM-модель на лету без повторного запуска мастера настройки."
  - "Выполните [bold #00f0ff]kps ai config test[/], чтобы отправить легкий пинг на настроенную конечную точку модели и проверить подключение."
  - "Введите [bold #38bdf8]z <запрос>[/], чтобы телепортироваться в недавно используемые каталоги проектов через плагин portal."
  - "Выполните [bold #38bdf8]kps portal open[/], чтобы открыть текущую папку в проводнике Windows или Finder на macOS."
  - "Введите [bold #38bdf8]kps portal ls[/], чтобы просмотреть все отслеживаемые каталоги рабочей области, отсортированные по оценкам frecency."
  - "Выполните [bold #38bdf8]kps portal add <путь>[/], чтобы вручную зарегистрировать любой каталог в быстром индексе portal."
  - "Ошиблись в команде? Выполните [bold #00f0ff]kps fuck[/], чтобы автоматически исправить предыдущую ошибочную команду с помощью движка thefuck."
  - "Выполните [bold #38bdf8]kps help <команда>[/] для мгновенных практических шпаргалок на основе tealdeer."
  - "Выполните [bold #38bdf8]kps shore[/], чтобы протестировать и переключиться на самые быстрые зеркала менеджеров пакетов (PyPI, npm, Rust, Go, Homebrew)."
  - "Выполните [bold #38bdf8]kps init use node@20[/], чтобы настроить языковые среды выполнения без вмешательства через mise."
  - "Выполните [bold #38bdf8]kps alias add ll \"ls -la\"[/], чтобы определить кросс-шелловые алиасы, работающие одинаково в PowerShell, Bash и Zsh."
  - "Выполните [bold #38bdf8]kps install <пакет>[/], чтобы установить пакеты с помощью оптимального системного менеджера пакетов (Scoop/Winget/Brew/Apt)."
  - "Выполните [bold #38bdf8]kps autopilot add <команда>[/], чтобы поставить в очередь длительные сборки, загрузки или скрипты в фоновый демон-очередь."
  - "Запустите [bold #38bdf8]kps rec[/] для нечеткого поиска и выполнения вашей личной библиотеки повторяющихся командных сниппетов (pet)."
  - "Запустите [bold #38bdf8]kps profile[/] для синхронизации dotfiles и конфигураций оболочки между несколькими машинами через chezmoi."
  - "Запустите [bold #38bdf8]kapsel status[/] для проверки состояния терминала, текущей оболочки, механизма автодополнения и активных плагинов."
  - "Запустите [bold #38bdf8]kapsel config edit[/] для настройки тем, символов приглашения и стилей карточек в вашем редакторе по умолчанию."
  - "Запустите [bold #38bdf8]kapsel config set theme dracula[/] для переключения между палитрами цветов: default, dracula, cyberpunk и monochrome."
  - "Запустите [bold #38bdf8]kapsel search[/] для поиска официальных и сторонних плагинов, а затем установите их с помощью kapsel add <имя>."
  - "Запустите [bold #38bdf8]kps config set mode dev[/] для включения локальной разработки плагинов и режима горячей перезагрузки."
  - "Запустите [bold #38bdf8]kapsel upgrade[/] для автоматической проверки и обновления ядра Kapsel и всех установленных официальных плагинов."
  - "Добавьте свои личные заметки или командные скрипты в ~/.kapsel/tips.yaml; Kapsel включит их в ежедневные советы."
  - "Введите [bold #f43f5e]exit[/] или нажмите [bold #f43f5e]Ctrl+D[/] для безопасного выхода из Kapsel и возврата в вашу оболочку без загрязнения."
