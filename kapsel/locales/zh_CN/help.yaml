# Kapsel 系统手册与命令速查指南 (简体中文)
meta:
  title: "KAPSEL"
  subtitle: "使用指南与命令速查手册"
  architecture: "统一交互管道: 'kapsel <cmd>' 与 'kps <cmd>' 共享完全相同的执行内核。"
  version_prefix: "v"

modes:
  title: "🚀 核心交互机制"
  columns:
    mode: "模式"
    trigger: "触发方式"
    description: "行为与特性"
  rows:
    - name: "原生模式 (Native)"
      trigger: "直接输入原生系统命令"
      description: "100% 原生宿主执行 (git, docker, npm, python, vim 等)，配备 Carapace 深度上下文动态补全。"
    - name: "胶囊模式 (Kapsel)"
      trigger: "输入 'kapsel ' 或 'kps '"
      description: "统一胶囊指令 (help, status, config, language, add, toggle 及插件扩展)；Tab 展开候选。"

quickstart:
  title: "⚡ 极速上手工作流"
  items:
    - step: "1. 开启交互终端"
      cmd: "kapsel toggle"
      desc: "启动智能终端胶囊会话，享受实时补全与智能历史建议。"
    - step: "2. 原生无缝执行"
      cmd: "git checkout -b feature"
      desc: "无感运行任意原生命令，Carapace 自动感知分支名、参数与文件路径。"
    - step: "3. 单次外部调用"
      cmd: "kps status"
      desc: "在外部 PowerShell、Bash 或 CMD 中直接以单条指令运行胶囊工具。"
    - step: "4. 安全无痕退出"
      cmd: "exit"
      desc: "安全退出胶囊环境并返回宿主终端，不残留后台进程与脏环境。"

commands:
  title: "⚙️ 胶囊指令集 (kapsel / kps)"
  columns:
    command: "指令"
    description: "功能说明"
    origin: "来源"
  builtin_rows:
    - name: "kps help"
      desc: "显示完整的系统使用指南、交互机制与命令速查手册"
      origin: "Core 核心"
    - name: "kps status"
      desc: "查看操作系统平台、宿主终端、Git 分支及沙箱运行看板"
      origin: "Core 核心"
    - name: "kps config"
      desc: "查看、编辑、读取、设置或热重载 ~/.kapsel/config.yaml"
      origin: "Core 核心"
    - name: "kps language"
      desc: "查看并切换界面语言 (en, zh_CN, ja, es, fr, de, ru)"
      origin: "Core 核心"
    - name: "kps datadir"
      desc: "查看或安全搬迁数据存储沙箱目录 (全量自动搬迁，旧位置彻底清除)"
      origin: "Core 核心"
    - name: "kps add <plugin>"
      desc: "安装依赖并将外部插件启用注册至当前 Kapsel 运行环境"
      origin: "Core 核心"
    - name: "kps toggle"
      desc: "开启或关闭 Kapsel 终端默认交互会话"
      origin: "Core 核心"
    - name: "exit / quit"
      desc: "安全退出 Kapsel 终端胶囊，无痕返回宿主原生 Shell"
      origin: "Core 核心"

shortcuts:
  title: "⌨️ 常用快捷键与灵敏交互"
  columns:
    key: "按键"
    description: "功能动作"
  items:
    - key: "Tab"
      desc: "触发自动补全候选菜单或在候选项间循环轮询"
    - key: "Shift + Tab"
      desc: "在自动补全候选菜单中反向回退前一个候选项"
    - key: "Enter"
      desc: "确认采纳高亮候选词 (自动补空格追加参数) 或执行当前命令"
    - key: "↑ (方向键上)"
      desc: "按时间线反向漫游浏览执行历史记录"
    - key: "↓ (方向键下)"
      desc: "顺向漫游历史记录，或在补全菜单中向下选词"
    - key: "→ (单次点按)"
      desc: "逐词 (Word-by-word) 采纳灰色行内预测建议"
    - key: "→ (连续长按)"
      desc: "一键采纳整行完整的灰色行内预测命令"
    - key: "Ctrl + C"
      desc: "取消当前输入行并重置输入提示符"
    - key: "Ctrl + D"
      desc: "正常退出终端胶囊交互会话 (EOF)"

tips:
  title: "💡 进阶使用技巧"
  items:
    - "运行 'kps config edit' 可直接在默认外部编辑器 (VSCode / 记事本) 中编辑配置文件。"
    - "在本地插件仓库中增删插件后，随时运行 'kps add update' 即可自动刷新补全字典。"
    - "随时运行 'kps language <代码/缩写>' (如 'kps language en' 或 'kps language ja') 即刻切换语言。"
    - "跨盘迁移数据非常安全：运行 'kps datadir D:\\KapselData' 即可全自动搬迁数据库与配置。"
