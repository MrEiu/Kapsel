# Kapsel 终端实用技巧与快捷指南 (简体中文)
title: "技巧:"
tips:
  - "当补全建议仅剩 1 项候选词时，直接按 [bold #00f0ff]→[/] (右箭头) 即可瞬间采纳。"
  - "按 [bold #00f0ff]→[/] (右箭头) 可分词采纳历史灰色预测；长按或连敲两下可瞬间填满整行幽灵文本。"
  - "随时按 [bold #f59e0b]Tab[/] 键可唤起 Carapace 针对 1,000+ 命令的深度多级上下文与参数补全。"
  - "连续按两次 [bold #f59e0b]Tab[/] 键可在补全下拉框中展开完整网格候选项矩阵。"
  - "在补全候选菜单展开时，按 [bold #f59e0b]Shift+Tab[/] 即可向上逆向循环选择候选项。"
  - "按 [bold #f59e0b]Ctrl+W[/] 或 [bold #f59e0b]Alt+Backspace[/]，可向左快速删除光标前的一个完整单词。"
  - "按 [bold #f59e0b]Ctrl+U[/] 可快速清空光标左侧的全部输入内容；按 [bold #f59e0b]Ctrl+K[/] 可清除光标右侧内容。"
  - "按 [bold #f59e0b]Ctrl+A[/] (或 Home) 快速跳转到行首；按 [bold #f59e0b]Ctrl+E[/] (或 End) 快速跳转到行尾。"
  - "按 [bold #38bdf8]Ctrl+L[/] 可随时清空终端屏幕并重新渲染优雅的欢迎卡片。"
  - "在输入行按 [bold #f43f5e]Ctrl+C[/] 会安全忽略当前行，绝不会误杀退出胶囊终端会话。"
  - "按 [bold #10b981]Ctrl+Enter[/] (或 Alt+Enter) 可直接将当前命令或粘贴的多行作为指令块执行，无需手动输入 kp 前缀。"
  - "按 [bold #a855f7]Ctrl+Shift+B[/] (或 [bold #a855f7]Ctrl+B[/]) 进入块漫游模式，随时翻阅历史执行输出与精准毫秒耗时。"
  - "在块漫游模式下，按 [bold #10b981]y[/] 复制输出文本，按 [bold #38bdf8]c[/] 复制命令，按 [bold #f59e0b]r[/] 一键重跑该块。"
  - "在块漫游模式下，按 [bold #f43f5e]Esc[/] 或 [bold #f43f5e]q[/] 即可平滑退出漫游，恢复先前的终端输入内容。"
  - "输入 [bold #a855f7]kp -c <多条命令>[/]，Kapsel 会启动多线程并行并发执行所有子任务。"
  - "输入 [bold #a855f7]kp <多条命令>[/]，按顺序原子执行整段任务并自动保持目录与上下文环境。"
  - "在 [bold #a855f7]kp[/] 或 [bold #a855f7]kp -c[/] 后面输入原生命令 (如 kp git)，无损享受 1,000+ 完整参数补全。"
  - "输入 [bold #00f0ff]kps ai <自然语言>[/]，AI 自动生成精准命令，按 [Enter] 直接运行，按 [Tab] 复制微调。"
  - "上一条命令报错时输入 [bold #00f0ff]kps ai fix[/] (或 kps ai ?)，自动诊断根因并提供 1-click 修复命令。"
  - "敲 [bold #00f0ff]kps ai commit[/]，自动分析当前工作区 git diff，生成规范提交语并可一键直接 commit。"
  - "遇到生僻复杂命令，敲 [bold #00f0ff]kps ai explain <命令>[/]，AI 逐项流式拆解各标志参数与管道含义。"
  - "通过管道运行 [bold #00f0ff]<命令> | kps ai <提示词>[/]，可对终端海量输出流进行实时摘要与异常筛选。"
  - "输入 [bold #00f0ff]kps ai scout[/]，自动探测当前工作区技术栈架构、测试/构建脚本与核心代码入口。"
  - "运行 [bold #00f0ff]kps ai config model <模型名>[/]，无需重走向导即可瞬间切换活跃大语言模型。"
  - "运行 [bold #00f0ff]kps ai config test[/]，可快速向配置的模型端点发送轻量 Ping 检查连通性。"
  - "输入 [bold #38bdf8]z <关键词>[/] 可使用 portal 插件模糊瞬移至最近常去的工作目录。"
  - "运行 [bold #38bdf8]kps portal open[/] 可直接在操作系统资源管理器或 Finder 中弹出当前文件夹。"
  - "输入 [bold #38bdf8]kps portal ls[/] 可按活跃度分数 (Frecency) 查阅所有被记录的工作区路径及排名。"
  - "输入 [bold #38bdf8]kps portal add <路径>[/]，可手动将任意外部工作目录注册至瞬移快速索引库中。"
  - "命令拼错不用慌，输入 [bold #00f0ff]kps fuck[/] 可自动感知并智能纠正上一条敲错的命令。"
  - "随时运行 [bold #38bdf8]kps help <命令>[/]，秒级调阅来自 tealdeer 的高频实操用例清单。"
  - "运行 [bold #38bdf8]kps shore[/]，自动对 PyPI、npm、Rust、Go 及系统包源进行测速并切换至最优镜像。"
  - "运行 [bold #38bdf8]kps init use node@20[/]，通过 mise 瞬间完成多开发语言与运行时的无侵入式配置。"
  - "运行 [bold #38bdf8]kps alias add ll \"ls -la\"[/]，一次定义即可在 PowerShell、Bash、Zsh 跨终端通用。"
  - "运行 [bold #38bdf8]kps install <软件名>[/]，自适应调用系统最优包管理器 (Scoop/Winget/Brew/Apt) 安装。"
  - "运行 [bold #38bdf8]kps autopilot add <命令>[/]，将长时间编译、备份或下载任务放入后台守护进程队列。"
  - "运行 [bold #38bdf8]kps rec[/]，模糊搜索并快速运行个人终端常用代码片段库 (pet)。"
  - "运行 [bold #38bdf8]kps profile[/]，使用 chezmoi 实现跨平台多台开发机之间的 Shell 环境无缝同步。"
  - "运行 [bold #38bdf8]kapsel status[/]，快速查看终端健康度、当前宿主 Shell、补全引擎与插件状态。"
  - "输入 [bold #38bdf8]kapsel config edit[/]，可在默认编辑器中实时修改配色主题、提示符与卡片边框。"
  - "输入 [bold #38bdf8]kapsel config set theme dracula[/]，随时在 default、dracula、cyberpunk 等主题间无缝切换。"
  - "输入 [bold #38bdf8]kapsel search[/]，检索官方与社区插件家族，输入 kapsel add <插件名> 即可一键启用。"
  - "在终端运行 [bold #38bdf8]kps config set mode dev[/]，即可开启本地插件热重载与快速开发调试模式。"
  - "运行 [bold #38bdf8]kapsel upgrade[/]，自动检查并同步升级 Kapsel 核心组件与所有已安装的官方插件。"
  - "在 ~/.kapsel/tips.yaml 中写入自己的团队备忘录或指令技巧，Kapsel 会自动混合轮播展示。"
  - "输入 [bold #f43f5e]exit[/] 或按 [bold #f43f5e]Ctrl+D[/]，可安全平滑退出胶囊终端，零残留返回原生 Shell。"
