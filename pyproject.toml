[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kapsel-cli"
version = "0.2.1"
description = "Next-generation cross-platform terminal capsule & ergonomic shell multiplexer with context-aware command translation and 1,000+ CLI completions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "MrEiu", email = "k648888@vip.qq.com" }
]
keywords = [
    "terminal",
    "shell",
    "cli",
    "multiplexer",
    "autocompletion",
    "cross-platform",
    "developer-tools",
    "carapace",
    "productivity",
    "powershell",
    "bash",
    "zsh"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Shells",
    "Topic :: System :: System Shells",
    "Topic :: Terminals",
    "Topic :: Utilities",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "prompt_toolkit>=3.0.40",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "shellingham>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/MrEiu/Kapsel"
Documentation = "https://github.com/MrEiu/Kapsel#readme"
Repository = "https://github.com/MrEiu/Kapsel"
Issues = "https://github.com/MrEiu/Kapsel/issues"
Changelog = "https://github.com/MrEiu/Kapsel/releases"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
kapsel = "kapsel.cli:main"
kps = "kapsel.cli:kps_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["kapsel*"]

[tool.setuptools.package-data]
kapsel = [
    "locales/**/*.yaml",
    "locales/**/*.mo",
    "locales/**/*.po",
    "locales/**/*.pot",
]
